# Validation for the GitHub copy of the repo. The full build → scan → publish → deploy pipeline
# runs on GitLab CI (.gitlab-ci.yml); this workflow never touches AWS.
name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/go.mod
          cache-dependency-path: services/go.sum
      - name: vet and test (race detector)
        working-directory: services
        run: |
          go vet ./...
          go test -race -count=1 ./...

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kubeconform
      - name: lint, render and validate against Kubernetes and CRD schemas
        run: |
          for s in catalog orders; do
            helm lint --strict charts/microservice -f "gitops/values/$s.yaml"
            helm template "$s" charts/microservice -f "gitops/values/$s.yaml" --namespace shop > "rendered-$s.yaml"
          done
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered-*.yaml gitops/apps gitops/platform

  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: scan IaC, manifests and Dockerfile (accepted risks in .trivyignore)
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.67.2 \
            config --severity HIGH,CRITICAL --exit-code 1 --helm-values gitops/values/catalog.yaml .
